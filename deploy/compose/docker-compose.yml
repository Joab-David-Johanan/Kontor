# Kontor "dev" profile: Postgres (with pgvector), Keycloak (identity provider) and the core API.
#
#   docker compose -f deploy/compose/docker-compose.yml up -d --build
#
# Secrets come from deploy/compose/.env (copy .env.example; never committed).
# The API runs the database migrations and loads demo data on start;
# keycloak-init creates the realms, the web client and the demo users.
name: kontor

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: kontor
      POSTGRES_PASSWORD: kontor
      POSTGRES_DB: kontor
    ports:
      # host port 5433: a local PostgreSQL service may already use 5432
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontor -d kontor"]
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in deploy/compose/.env}
      # Browsers (and token "iss" claims) use localhost:8080; containers may use keycloak:8080.
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  keycloak-init:
    build:
      context: ../../api
    depends_on:
      - keycloak
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USER: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KONTOR_DEMO_PASSWORD: ${KONTOR_DEMO_PASSWORD:?Set KONTOR_DEMO_PASSWORD in deploy/compose/.env}
      KONTOR_OIDC_CLIENT_SECRET: ${KONTOR_OIDC_CLIENT_SECRET:?Set KONTOR_OIDC_CLIENT_SECRET in deploy/compose/.env}
      KONTOR_APP_URL: http://localhost:3000
    command: python -m core.keycloak_bootstrap
    restart: "no"

  api:
    build:
      context: ../../api
    environment:
      KONTOR_ENVIRONMENT: dev
      KONTOR_DATABASE_URL: postgresql+asyncpg://kontor:kontor@db:5432/kontor
      # Token issuer as browsers see it, and where this container fetches the signing keys.
      KONTOR_OIDC_PUBLIC_BASE: http://localhost:8080
      KONTOR_OIDC_INTERNAL_BASE: http://keycloak:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head
      && python -m core.seed
      && uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  db-data:
  keycloak-data:
